<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0%" stop-color="#7fae87"/><stop offset="46%" stop-color="#3e6b4d"/><stop offset="100%" stop-color="#0f2519"/></linearGradient>
<linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fff" stop-opacity=".20"/><stop offset="44%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="bill" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0%" stop-color="#bfe0c3"/><stop offset="55%" stop-color="#8dc196"/><stop offset="100%" stop-color="#4e8a5c"/></linearGradient>
<linearGradient id="chk" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eceee7"/></linearGradient>
<linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#f4a25c"/><stop offset="100%" stop-color="#c26a1c"/></linearGradient>
<linearGradient id="coin" x1="0" y1="0" x2="0.4" y2="1">
<stop offset="0%" stop-color="#ffe08a"/><stop offset="52%" stop-color="#e0a83a"/><stop offset="100%" stop-color="#9d6b12"/></linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#tile)"/><rect width="1024" height="1024" fill="url(#glare)"/>
<ellipse cx="512" cy="884" rx="352" ry="30" fill="#08180f" opacity=".55"/>

<!-- banded cash stack -->
<g transform="rotate(-4 512 460)">
  <rect x="196" y="286" width="640" height="300" rx="24" fill="#2f5b3c"/>
  <rect x="188" y="262" width="640" height="300" rx="24" fill="#5f9c6c"/>
  <rect x="180" y="238" width="640" height="300" rx="24" fill="url(#bill)"/>
  <rect x="180" y="238" width="640" height="300" rx="24" fill="none" stroke="#3d7049" stroke-width="8"/>
  <circle cx="500" cy="388" r="88" fill="none" stroke="#4e8a5c" stroke-width="12" opacity=".8"/>
  <g stroke="#3f7a51" stroke-width="20" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M528 348 Q470 334 470 372 Q470 404 530 414 Q590 424 590 460 Q590 500 528 486"/>
  </g>
  <rect x="486" y="316" width="28" height="150" rx="14" fill="#3f7a51" opacity=".9"/>
  <g fill="#4e8a5c" opacity=".55">
    <rect x="228" y="286" width="120" height="18" rx="9"/>
    <rect x="228" y="322" width="86" height="18" rx="9"/>
    <rect x="676" y="472" width="120" height="18" rx="9"/>
    <rect x="710" y="508" width="86" height="18" rx="9"/>
  </g>
  <!-- the band -->
  <rect x="386" y="222" width="152" height="332" rx="10" fill="url(#band)"/>
  <rect x="386" y="222" width="152" height="332" rx="10" fill="none" stroke="#a8560c" stroke-width="7"/>
  <rect x="400" y="238" width="24" height="300" rx="12" fill="#ffffff" opacity=".28"/>
</g>

<!-- coins -->
<g>
  <ellipse cx="828" cy="742" rx="88" ry="86" fill="#7a5410" opacity=".45" transform="translate(6 10)"/>
  <circle cx="828" cy="742" r="86" fill="url(#coin)"/>
  <circle cx="828" cy="742" r="86" fill="none" stroke="#8a6410" stroke-width="9"/>
  <circle cx="828" cy="742" r="60" fill="none" stroke="#fff3cf" stroke-width="8" opacity=".5"/>
</g>

<!-- the check -->
<g transform="rotate(6 420 730)">
  <rect x="150" y="604" width="560" height="252" rx="20" fill="#20402c" opacity=".45" transform="translate(10 14)"/>
  <rect x="150" y="604" width="560" height="252" rx="20" fill="url(#chk)"/>
  <rect x="150" y="604" width="560" height="46" rx="20" fill="#e4832b"/>
  <rect x="150" y="632" width="560" height="18" fill="#e4832b"/>
  <g fill="#c3cbcd">
    <rect x="190" y="684" width="230" height="20" rx="10"/>
    <rect x="190" y="726" width="300" height="16" rx="8"/>
  </g>
  <rect x="500" y="676" width="170" height="56" rx="12" fill="#eef2ec" stroke="#b9c2bb" stroke-width="6"/>
  <rect x="524" y="694" width="122" height="20" rx="10" fill="#3d4a45"/>
  <path d="M196 800 q42 -46 74 -8 q22 26 44 -14 q20 -36 44 4 q16 30 42 -6"
        fill="none" stroke="#2f4a8c" stroke-width="13" stroke-linecap="round"/>
  <rect x="190" y="820" width="300" height="8" rx="4" fill="#c3cbcd"/>
</g>
</svg>
